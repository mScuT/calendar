# Test profile: in-memory H2 database. Never touches the production DB (./data/).
# Activated with @ActiveProfiles("test") on integration and end-to-end tests.
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# Build the schema on startup and drop it at the end, so each run starts clean.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# CalendarController injects @Value("${app.base-url}"); set it so the web context loads in tests.
app.base-url=http://localhost:8080

# Keep the discovery providers off by default in tests (no real API calls).
app.discover.ticketmaster.api-key=
app.discover.seatgeek.client-id=
